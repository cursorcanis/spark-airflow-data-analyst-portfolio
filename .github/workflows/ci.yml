name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4   # Spark unit tests need a JVM
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests airflow
      - name: Unit tests
        run: pytest -q
      - name: Validate docker-compose
        run: cp .env.example .env && docker compose config --quiet

  dbt:
    # Builds and tests the whole dbt project against a throwaway PostGIS + H3 database seeded with fixtures.
    # The database is our own image (docker/postgres), so CI runs the exact extensions production has.
    runs-on: ubuntu-latest
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: warehouse
      DBT_PG_HOST: localhost
      DBT_PG_USER: ci
      DBT_PG_PASSWORD: ci
      DBT_PG_DBNAME: warehouse
      DBT_PROFILES_DIR: dbt
      DBT_PROJECT_DIR: dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Start PostGIS + H3 (built from docker/postgres)
        run: |
          docker build -t atl-transit/postgres:ci docker/postgres
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=warehouse \
            atl-transit/postgres:ci
          for i in $(seq 1 60); do docker exec pg pg_isready -U ci -d warehouse -h localhost && break; sleep 2; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.12.7" "dbt-postgres==1.11.0"
      - name: Seed raw schema with fixtures
        run: psql -v ON_ERROR_STOP=1 -f ci/seed_warehouse.sql
      - name: dbt build (models + tests)
        run: dbt build --target ci
      - name: dbt build again (incremental path)
        run: dbt build --target ci
      - name: Assert known answers in marts
        run: psql -v ON_ERROR_STOP=1 -f ci/assert_marts.sql
      - name: Generate dbt docs (one self-contained HTML page)
        run: dbt docs generate --target ci --static
      - name: Assemble GitHub Pages site (web map + dbt docs)
        run: |
          mkdir -p _site/dbt
          cp -r web/. _site/
          cp dbt/target/static_index.html _site/dbt/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pages:
    # Publishes the site only from main, and only after unit tests and the dbt checks passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, dbt]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
