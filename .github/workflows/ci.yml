name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4   # Spark unit tests need a JVM
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests airflow
      - name: Unit tests
        run: pytest -q
      - name: Validate docker-compose
        run: cp .env.example .env && docker compose config --quiet
