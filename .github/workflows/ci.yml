name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4   # Spark unit tests need a JVM
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests airflow
      - name: Unit tests
        run: pytest -q
      - name: Validate docker-compose
        run: cp .env.example .env && docker compose config --quiet

  dbt:
    # Builds and tests the whole dbt project against a throwaway PostGIS database seeded with fixtures.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: ci
      PGPASSWORD: ci
      PGDATABASE: warehouse
      DBT_PG_HOST: localhost
      DBT_PG_USER: ci
      DBT_PG_PASSWORD: ci
      DBT_PG_DBNAME: warehouse
      DBT_PROFILES_DIR: dbt
      DBT_PROJECT_DIR: dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.12.7" "dbt-postgres==1.11.0"
      - name: Seed raw schema with fixtures
        run: psql -v ON_ERROR_STOP=1 -f ci/seed_warehouse.sql
      - name: dbt build (models + tests)
        run: dbt build --target ci
      - name: dbt build again (incremental path)
        run: dbt build --target ci
      - name: Assert known answers in marts
        run: psql -v ON_ERROR_STOP=1 -f ci/assert_marts.sql
