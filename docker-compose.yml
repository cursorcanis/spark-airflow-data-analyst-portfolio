# Local, $0 data platform: Airflow + S3-compatible lake (RustFS) + Postgres/PostGIS + Spark.
# Sized for a 16 GB laptop. Copy .env.example to .env and fill in secrets before `docker compose up -d`.
name: atl-transit

x-airflow-common: &airflow-common
  # Official Airflow image + our extra packages (docker/airflow/Dockerfile); built locally on first `up`.
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: atl-transit/airflow:3.4.0-3
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/New_York
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set in .env}
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set in .env}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set in .env}@postgres:5432/airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    # Data-lake connection: any S3-compatible endpoint (RustFS locally, drop endpoint_url for AWS S3).
    AIRFLOW_CONN_LAKE_S3: >-
      {"conn_type": "aws", "login": "${LAKE_ACCESS_KEY:?set in .env}", "password": "${LAKE_SECRET_KEY:?set in .env}",
      "extra": {"endpoint_url": "http://lake:9000", "region_name": "us-east-1"}}
    # Warehouse connection (PostGIS) used by reference-data loads and, later, dbt.
    AIRFLOW_CONN_WAREHOUSE_PG: >-
      {"conn_type": "postgres", "host": "postgres", "port": 5432, "schema": "warehouse",
      "login": "warehouse", "password": "${WAREHOUSE_DB_PASSWORD}"}
    POLL_VEHICLE_POSITIONS_S: ${POLL_VEHICLE_POSITIONS_S:-30}
    POLL_TRIP_UPDATES_S: ${POLL_TRIP_UPDATES_S:-120}
    RAW_RT_RETENTION_DAYS: ${RAW_RT_RETENTION_DAYS:-14}
    SPARK_CONNECT_URL: sc://spark-connect:15002
    # dbt connects to the warehouse with these (dbt/profiles.yml reads env vars)
    DBT_PG_HOST: postgres
    DBT_PG_USER: warehouse
    DBT_PG_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    DBT_PG_DBNAME: warehouse
    CENSUS_API_KEY: ${CENSUS_API_KEY:-}   # optional; ACS demographics are skipped without it
    HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}   # optional; off-box dead man's switch (pipeline_heartbeat DAG)
    OFFLINE_WINDOW: ${OFFLINE_WINDOW:-}           # optional daily no-internet window, e.g. 00:00-07:00
    OFFLINE_WINDOW_TZ: ${OFFLINE_WINDOW_TZ:-UTC}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./dbt:/opt/airflow/dbt:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    lake:
      condition: service_started

x-spark-common: &spark-common
  # Official Spark image + Delta Lake + S3A jars (docker/spark/Dockerfile)
  build:
    context: docker/spark
  image: atl-transit/spark:4.2.1-delta4.4.1-2
  environment: &spark-env
    SPARK_NO_DAEMONIZE: "true"
    # S3A reads lake credentials from the standard AWS env vars (keeps secrets out of process arguments)
    AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY}
  restart: unless-stopped

services:
  postgres:
    # PostGIS + H3 (docker/postgres/Dockerfile)
    build:
      context: docker/postgres
    image: atl-transit/postgres:17-3.7-h3
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set in .env}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g }
    restart: unless-stopped

  lake:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${LAKE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${LAKE_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - lake-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:9000:9000"   # S3 API
      - "${BIND_ADDR:-127.0.0.1}:9001:9001"   # web console
    deploy:
      resources:
        limits: { memory: 512m }
    restart: unless-stopped

  # 24/7 capture of MARTA GTFS-realtime feeds -> raw snapshots in the lake (see src/atl_transit/rt_poller.py)
  rt-poller:
    build:
      context: .
      dockerfile: docker/poller/Dockerfile
    image: atl-transit/rt-poller:0.1.1
    environment:
      LAKE_ENDPOINT_URL: http://lake:9000
      LAKE_ACCESS_KEY: ${LAKE_ACCESS_KEY}
      LAKE_SECRET_KEY: ${LAKE_SECRET_KEY}
      LAKE_RAW_BUCKET: raw
      POLL_VEHICLE_POSITIONS_S: ${POLL_VEHICLE_POSITIONS_S:-30}
      POLL_TRIP_UPDATES_S: ${POLL_TRIP_UPDATES_S:-120}
      OFFLINE_WINDOW: ${OFFLINE_WINDOW:-}
      OFFLINE_WINDOW_TZ: ${OFFLINE_WINDOW_TZ:-UTC}
    depends_on:
      lake:
        condition: service_started
    deploy:
      resources:
        limits: { memory: 256m }
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set in .env}
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { memory: 1536m }
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { memory: 2g }
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits: { memory: 768m }
    restart: unless-stopped

  # ---- Spark: standalone cluster + Spark Connect server (Spark 4 client/server API) ----------------------
  spark-master:
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8081:8080"   # master UI
    deploy:
      resources:
        limits: { memory: 768m }

  spark-worker:
    <<: *spark-common
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      <<: *spark-env
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8082:8081"   # worker UI
    depends_on:
      - spark-master
    deploy:
      resources:
        limits: { memory: 3g }

  # Long-running Spark application that accepts DataFrame plans over gRPC (port 15002).
  # Airflow tasks connect with the thin `pyspark-client` (sc://spark-connect:15002): no Java and no
  # Python-version coupling in the Airflow image. This process is the Spark *driver*; executors run on the worker.
  spark-connect:
    <<: *spark-common
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --master
      - spark://spark-master:7077
      - --conf
      - spark.driver.memory=1g
      - --conf
      - spark.driver.host=spark-connect
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.executor.memory=${SPARK_EXECUTOR_MEMORY:-1536m}
      - --conf
      - spark.executor.cores=4
      - --conf
      - spark.sql.shuffle.partitions=8
      - --conf
      - spark.sql.session.timeZone=UTC
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.hadoop.fs.s3a.endpoint=http://lake:9000
      - --conf
      - spark.hadoop.fs.s3a.endpoint.region=us-east-1
      - --conf
      - spark.hadoop.fs.s3a.path.style.access=true
      - --conf
      - spark.hadoop.fs.s3a.connection.ssl.enabled=false
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8083:4040"   # Spark application UI (jobs, stages, SQL plans)
    depends_on:
      - spark-master
      - spark-worker
      - lake
    deploy:
      resources:
        limits: { memory: 1536m }

volumes:
  postgres-data:
  lake-data:
  airflow-logs:
