[project]
name = "atl-transit"
version = "0.1.0"
description = "Local-first data platform for Atlanta (MARTA) transit data"
requires-python = ">=3.12"

dependencies = [
    "requests>=2.32", "boto3>=1.40", "pyarrow>=20", "gtfs-realtime-bindings==2.0.0", "protobuf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyspark==4.2.1", "pendulum>=3"]   # pendulum: Airflow passes pendulum DateTimes to tasks

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long fixture rows
