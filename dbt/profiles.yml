# All connection details come from environment variables: no secrets in the repo.
atl_transit:
  target: prod
  outputs:
    prod: &pg
      type: postgres
      host: "{{ env_var('DBT_PG_HOST') }}"
      port: "{{ env_var('DBT_PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_PG_USER') }}"
      password: "{{ env_var('DBT_PG_PASSWORD') }}"
      dbname: "{{ env_var('DBT_PG_DBNAME') }}"
      schema: staging
      threads: 4
    ci: *pg                      # GitHub Actions: throwaway PostGIS service container
