version: 2

sources:
  - name: raw
    description: Tables published into the warehouse by Airflow (Spark JDBC loads and Census API loads).
    schema: raw
    tables:
      - name: gtfs_routes
      - name: gtfs_stops
      - name: gtfs_trips
      - name: gtfs_stop_times
      - name: gtfs_calendar
      - name: gtfs_calendar_dates
      - name: gtfs_shapes
      - name: rt_stop_arrivals
        description: Observed vs scheduled arrivals from MARTA GTFS-realtime, curated by Spark.
        loaded_at_field: "observed_arrival_ts at time zone 'UTC'"
        freshness:                 # MARTA has almost no service ~1-5 AM, hence the generous error threshold
          warn_after: {count: 3, period: hour}
          error_after: {count: 12, period: hour}
      - name: rt_vehicle_pings
        description: Bus GPS fixes with the speed since the previous fix (Spark; loaded daily).
        loaded_at_field: "event_ts at time zone 'UTC'"
        freshness:                 # loaded once a day at 04:30 Atlanta time
          warn_after: {count: 30, period: hour}
          error_after: {count: 54, period: hour}
      - name: rt_arrival_gps_check
        description: Each feed-reported arrival checked against the bus's own GPS track (Spark; loaded daily).
      - name: census_tracts
      - name: acs_tract_demographics
